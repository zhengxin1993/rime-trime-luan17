# ---------------------------------------------------------------------------
# 配色方案：default = 浅色，dark = 深色
#
# 自动切换靠配色内部的两个链接字段（Trime 3.2.6+，官方 tongwenfeng
# 主题即此写法）：
#   dark_scheme  —— 系统进入深色模式时，本配色改用哪个配色
#   light_scheme —— 系统回到浅色模式时，本配色改用哪个配色
# 两套配色都写了双向链接，所以无论你在设置里选了「浅色」还是「深色」，
# 键盘都会跟随系统；深色配色单独写 light_scheme 才不会出现
# 「切回白天后悬浮窗仍是夜间配色」的老问题。
#
# ⚠ 同文设置里的「跟随系统夜间模式」默认是关闭的，必须手动打开，
#   否则配色固定不变、不会自动切换。
# ---------------------------------------------------------------------------
preset_color_schemes:
  default:
    name: 乱17·浅色（自动）
    author: WorkBuddy
    light_scheme: default
    dark_scheme: dark
    back_color: 0xFFFFFF
    text_color: 0x111111
    border_color: 0xD8DDE3
    candidate_separator_color: 0xE4E7EB
    candidate_text_color: 0x1F2328
    # 上行拼音是两行布局里要读的小字，调深到约 6:1，避免 13sp 发灰
    comment_text_color: 0x5B626B
    hilited_back_color: 0xEEF3F8
    hilited_text_color: 0x111111
    hilited_candidate_back_color: 0xDCE5EF
    hilited_candidate_text_color: 0x0B4F8A
    hilited_comment_text_color: 0x5F6670
    keyboard_back_color: 0xEEF1F4
    key_back_color: 0xFFFFFF
    key_border_color: 0xD8DDE3
    key_text_color: 0x111111
    key_symbol_color: 0x8A9199
    hilited_key_back_color: 0xDCE5EF
    hilited_key_text_color: 0x111111
    off_key_back_color: 0xE8ECF0
    hilited_off_key_back_color: 0xDCE5EF
    off_key_text_color: 0x4E5968
    on_key_back_color: 0xCDD8E4
